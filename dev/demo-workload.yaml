# Demo pods for k10s: `kubectl --context kind-k10s apply -f dev/demo-workload.yaml`
# "web" and "api" stay healthy; "flaky" crashes after a random delay -> CrashLoopBackOff (on fire).
apiVersion: v1
kind: Namespace
metadata:
  name: village
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: village
spec:
  replicas: 8
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      topologySpreadConstraints:   # spread pods across nodes -> every house gets villagers
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: web } }
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          resources: { requests: { cpu: 10m, memory: 16Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: village
spec:
  replicas: 6
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      topologySpreadConstraints:   # spread pods across nodes -> every house gets villagers
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: api } }
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources: { requests: { cpu: 10m, memory: 8Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaky
  namespace: village
spec:
  replicas: 4
  selector: { matchLabels: { app: flaky } }
  template:
    metadata: { labels: { app: flaky } }
    spec:
      topologySpreadConstraints:   # spread pods across nodes -> every house gets villagers
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: flaky } }
      containers:
        - name: flaky
          image: busybox:1.36
          command: ["sh", "-c", "sleep $((RANDOM % 40 + 10)); echo 'boom'; exit 1"]
          resources: { requests: { cpu: 10m, memory: 8Mi } }
