# Push a tag like v0.1.0 to build a universal macOS binary, publish a GitHub Release,
# and (if the TAP_TOKEN secret is set) update the Homebrew formula in homebrew-tap.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest # the binary still targets macOS 13+ via the dist preset
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: brew install ninja

      # The default Xcode can ship an older libc++ where std::jthread/stop_token are
      # still experimental; use the newest one installed on the runner.
      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          echo "Using ${XCODE}"
          sudo xcode-select -s "${XCODE}"
          clang++ --version
          xcrun --show-sdk-version

      - name: Build (universal, macOS 13+)
        run: |
          set -o pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          report() { grep -E "error|Error" "$1" | head -20 | sed 's/^/::error::/'; exit 1; }
          cmake --preset dist -DK10S_VERSION="${VERSION}" 2>&1 | tee configure.log || report configure.log
          cmake --build --preset dist 2>&1 | tee build.log || report build.log

      - name: Check the binary
        run: |
          lipo -archs build/dist/k10s
          otool -L build/dist/k10s
          build/dist/k10s --version

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="k10s-${VERSION}-macos-universal.tar.gz"
          tar -czf "${TARBALL}" -C build/dist k10s
          shasum -a 256 "${TARBALL}" > "${TARBALL}.sha256"
          packaging/homebrew/render-formula.sh "${VERSION}" "${TARBALL}" > k10s.rb
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${TARBALL}" "${TARBALL}.sha256" k10s.rb \
            --title "k10s ${GITHUB_REF_NAME}" --generate-notes

      - name: Update Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/michaelzheng67/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp k10s.rb tap/Formula/k10s.rb
          cd tap
          git config user.name "k10s release bot"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/k10s.rb
          git commit -m "k10s ${GITHUB_REF_NAME}"
          git push
